name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (editable, with dev tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest (real-data tests skip without the licensed BDD100K subset)
        run: python -m pytest -rs
      - name: CLI smoke test
        run: |
          labelguard --version
          labelguard rules
          labelguard profiles

  package:
    name: Wheel install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel into a clean virtual environment and run the CLI
        run: |
          python -m venv /tmp/lg
          /tmp/lg/bin/pip install dist/*.whl
          cd /tmp
          /tmp/lg/bin/labelguard --version
          /tmp/lg/bin/labelguard rules | grep -c "^[A-Z]\{3\}[0-9]\{3\}"
          /tmp/lg/bin/python -c "import labelguard.ui.state, labelguard.benchmark.runner; print('imports ok')"
